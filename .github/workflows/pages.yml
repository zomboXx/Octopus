name: Publish Octopus demo

on:
  push:
    branches: [main]
    paths:
      - "apps/website/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static demo
        run: |
          cp -a apps/website/dist "$RUNNER_TEMP/octopus-pages"
          sed -i 's/<html lang="vi">/<html lang="vi" data-static-demo>/' "$RUNNER_TEMP/octopus-pages/try/index.html"
          grep -q 'data-static-demo' "$RUNNER_TEMP/octopus-pages/try/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/octopus-pages
      - uses: actions/deploy-pages@v4
        id: deployment
