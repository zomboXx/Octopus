name: Publish Octopus demo

on:
  push:
    branches: [main]
    paths:
      - "apps/website/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare demo
        env:
          OCTOPUS_PUBLIC_PLANNING_URL: ${{ vars.OCTOPUS_PUBLIC_PLANNING_URL || 'https://octopus-planning.beadedeasel2.chatgpt.site/api/plans' }}
        run: |
          cp -a apps/website/dist "$RUNNER_TEMP/octopus-pages"
          node apps/website/scripts/configure-planning.mjs "$RUNNER_TEMP/octopus-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/octopus-pages
      - uses: actions/deploy-pages@v4
        id: deployment
